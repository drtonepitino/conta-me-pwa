<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Conta-me — histórias para adormecer.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Conta-me</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f6f7fb}
    *{box-sizing:border-box} body{margin:0;min-height:100vh}
    main{max-width:720px;margin:auto;padding:24px 18px 48px}
    .brand{font-size:34px;font-weight:800;margin:8px 0 4px}.sub{color:#6b7280;margin:0 0 20px}
    .card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 8px 30px #00000012}
    h2{margin-top:0}.scene{font-size:19px;line-height:1.7}
    button,input{font:inherit}button{width:100%;border:0;border-radius:15px;padding:14px 16px;margin:7px 0;background:#111827;color:#fff;font-weight:700}
    button.secondary{background:#e5e7eb;color:#111827} input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:15px;margin:8px 0 12px}
    .choices{margin-top:14px}.meta{font-size:13px;color:#6b7280;margin-bottom:8px}
    .error{color:#b91c1c;font-size:14px;min-height:20px}.offline{position:fixed;left:12px;right:12px;bottom:12px;background:#111827;color:white;padding:10px 14px;border-radius:12px;text-align:center;font-size:13px;display:none}
  </style>
</head>
<body>
<main>
  <div class="brand">Conta-me</div>
  <p class="sub">Uma aventura tranquila para terminar o dia.</p>
  <div id="app"></div>
</main>
<div id="offline" class="offline">Modo offline ativo — o estado local continua disponível.</div>
<script src="app.js"></script>
</body>
</html>
